<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6cc1f0">
  <title>bodylog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene" aria-hidden="true"></div>
  <main>
    <header>
      <div class="brand"><span class="logo"></span>bodylog</div>
      <button id="logout" class="ghost" hidden>퇴장</button>
    </header>

    <p id="msg" role="status"></p>

    <section id="auth" class="card hero" hidden>
      <h2>농장 입장</h2>
      <h1>오늘도 한 칸씩,<br>건강한 농장 일지.</h1>
      <p class="sub">체중과 식단을 하루 10초로 기록해요.</p>
      <form id="auth-form">
        <input id="email" type="email" placeholder="이메일" required autocomplete="email">
        <input id="password" type="password" placeholder="비밀번호 (6자 이상)" required minlength="6" autocomplete="current-password">
        <div class="row">
          <button type="submit" id="signin">로그인</button>
          <button type="button" id="signup" class="ghost">회원가입</button>
        </div>
      </form>
    </section>

    <div id="app" hidden>
      <div class="stats">
        <div class="stat"><i class="i-heart"></i><span>현재 체중</span><b id="s-now">-</b></div>
        <div class="stat"><i class="i-star"></i><span>시작 대비</span><b id="s-diff">-</b></div>
        <div class="stat"><i class="i-apple"></i><span>오늘 섭취</span><b id="s-kcal">-</b></div>
      </div>

      <section class="card">
        <h2>오늘의 몸무게</h2>
        <form id="weight-form" class="grid">
          <input id="w-date" type="date" required>
          <input id="w-kg" type="number" step="0.1" min="1" placeholder="체중 (kg)" required>
          <input id="w-fat" type="number" step="0.1" min="0" max="100" placeholder="체지방 (%)">
          <input id="w-memo" type="text" placeholder="메모">
          <button type="submit">저장</button>
        </form>
        <canvas id="chart" height="170"></canvas>
        <ul id="weight-list"></ul>
      </section>

      <section class="card">
        <h2>오늘의 식사</h2>
        <form id="meal-form" class="grid">
          <input id="m-date" type="date" required>
          <select id="m-type">
            <option>아침</option><option>점심</option><option>저녁</option><option>간식</option>
          </select>
          <input id="m-menu" type="text" placeholder="메뉴" required>
          <input id="m-kcal" type="number" min="0" placeholder="kcal">
          <button type="submit">추가</button>
        </form>
        <p id="m-total"></p>
        <ul id="meal-list"></ul>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
