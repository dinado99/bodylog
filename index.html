<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bodylog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>bodylog</h1>
      <button id="logout" hidden>로그아웃</button>
    </header>

    <p id="msg" role="status"></p>

    <section id="auth" hidden>
      <h2>로그인</h2>
      <form id="auth-form">
        <input id="email" type="email" placeholder="이메일" required autocomplete="email">
        <input id="password" type="password" placeholder="비밀번호 (6자 이상)" required minlength="6" autocomplete="current-password">
        <div class="row">
          <button type="submit" id="signin">로그인</button>
          <button type="button" id="signup" class="secondary">회원가입</button>
        </div>
      </form>
    </section>

    <div id="app" hidden>
      <section>
        <h2>체중</h2>
        <form id="weight-form" class="grid">
          <input id="w-date" type="date" required>
          <input id="w-kg" type="number" step="0.1" min="1" placeholder="체중(kg)" required>
          <input id="w-fat" type="number" step="0.1" min="0" max="100" placeholder="체지방(%)">
          <input id="w-memo" type="text" placeholder="메모">
          <button type="submit">저장</button>
        </form>
        <canvas id="chart" height="160"></canvas>
        <ul id="weight-list"></ul>
      </section>

      <section>
        <h2>식단</h2>
        <form id="meal-form" class="grid">
          <input id="m-date" type="date" required>
          <select id="m-type">
            <option>아침</option><option>점심</option><option>저녁</option><option>간식</option>
          </select>
          <input id="m-menu" type="text" placeholder="메뉴" required>
          <input id="m-kcal" type="number" min="0" placeholder="kcal">
          <button type="submit">추가</button>
        </form>
        <p id="m-total"></p>
        <ul id="meal-list"></ul>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
